name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # python-dotenv and requests are pulled in transitively by config.py
          # and data_loader.py, which the engine and the CRSP v2 loader import.
          # Both are already in requirements.txt.
          pip install pytest numpy pandas pyarrow python-dotenv requests

      # The suite is deliberately offline: no test reads a vendor API, a
      # database, or a credential. Anything needing licensed data is exercised
      # against fixtures instead, so CI proves the logic without proving that
      # a secret was configured.
      - name: Run tests
        run: python -m pytest tests -q

      - name: Verify committed schedule tables
        run: python run_schedule_audit.py --check
